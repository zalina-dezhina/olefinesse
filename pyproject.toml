[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "olefins_ddf"
version = "0.1.0"
description = "Delta-Delta furnace-health analysis & forecasting toolkit"
requires-python = ">=3.9"
dependencies = [
    "pandas",
    "numpy",
    "matplotlib",
    "pyarrow",
    "databricks-connect==13.3.13",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["olefins_ddf*"]
